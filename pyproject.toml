[project]
name = "geometrikks"
version = "0.1.0"
description = "Geo metrics ingress service built with Litestar."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "litestar[standard,brotli,jwt,picologging,pydantic]>=2.18.0",
    "geoip2>=5.2.0",
    "geohash2>=1.1",
    "ipy>=1.1",
    "python-dotenv>=1.2.1",
    "pydantic-settings>=2.0.0",
    "asyncpg>=0.30.0",
    "httpx-oauth>=0.16.1",
    "aiofiles>=25.1.0",
    "geoalchemy2>=0.18.1",
    "litestar-geoalchemy>=0.1.0",
    "apscheduler>=3.10,<4.0",
    "litestar-vite>=0.15.0",
    "litestar-granian>=0.14.2",
    "advanced-alchemy[argon2,passlib,pwdlib,cli]>=1.8.2",
    "alembic>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ty>=0.0.4",
    "faker>=33.0.0",
    "polyfactory>=2.18.0",
    "litestar-mcp>=0.5.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Reduce noise from third-party libs; keep real test warnings visible
    "ignore:There is no current event loop:DeprecationWarning",
]
