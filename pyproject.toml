[project]
name = "geometrikks"
version = "0.2.2"
description = "Geo metrics ingress service built with Litestar."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "litestar[standard,brotli,jwt,picologging,pydantic]>=2.24.0",
    "geoip2>=5.2.0",
    "geohash2>=1.1",
    "ipy>=1.1",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.14.2",
    "asyncpg>=0.31.0",
    "httpx>=0.28",
    "httpx-oauth>=0.17.0",
    "aiofiles>=25.1.0",
    "geoalchemy2>=0.20.0",
    "litestar-geoalchemy>=0.3.0",
    "apscheduler>=3.11.3,<4.0",
    "litestar-vite>=0.25.0",
    "litestar-granian>=0.15.0",
    "advanced-alchemy[argon2,passlib,pwdlib,cli]>=1.11.0",
    "alembic>=1.18.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ty>=0.0.56",
    "faker>=40.28.1",
    "polyfactory>=3.3.0",
    "litestar-mcp>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs a live TimescaleDB (docker compose up -d timescale_db); auto-skipped when unreachable",
]
filterwarnings = [
    # Reduce noise from third-party libs; keep real test warnings visible
    "ignore:There is no current event loop:DeprecationWarning",
    # False positive: our auth exclude pattern deliberately matches everything
    # outside /api/ (SPA shell, assets, /health). The boundary is verified by
    # tests/test_auth_endpoints.py (401 on /api/*, 200 on excluded paths).
    "ignore:.*exclude pattern.*greedily matches all paths.*:litestar.utils.warnings.LitestarWarning",
]
