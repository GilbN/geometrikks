name: Extension

on:
  pull_request:
    paths:
      - "extension/**"
      - "resources/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/extension.yml"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run ext:typecheck
      - name: Unit tests
        run: bun run ext:test
      - name: Build
        run: bun run ext:build
      - name: Check the build
        run: bun run ext:check-dist
      - name: Zip
        run: bun run ext:zip
      - name: Upload the zip
        uses: actions/upload-artifact@v7
        with:
          name: geometrikks-chrome
          path: extension/geometrikks-chrome-*.zip
          if-no-files-found: error
          retention-days: 14

  attach:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: geometrikks-chrome
          path: dist-zip
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist-zip/geometrikks-chrome-*.zip --clobber
