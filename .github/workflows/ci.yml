name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg18
        env:
          POSTGRES_USER: geouser
          POSTGRES_PASSWORD: geopass
          POSTGRES_DB: geometrikks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geouser -d geometrikks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Type check
        run: uv run ty check geometrikks tests
      - name: Run tests (unit + integration)
        env:
          IT_DB_HOST: localhost
          IT_DB_PORT: "5432"
          IT_DB_USER: geouser
          IT_DB_PASSWORD: geopass
        run: uv run pytest -v
      - name: Config docs freshness
        run: uv run python scripts/generate_config_docs.py --check

  contracts:
    # The committed generated client (resources/generated/) must be exactly
    # what the backend produces, and the frontend must type-check against it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Typegen composes the real app; auth settings demand a password even
      # though no server ever starts. Deliberately non-secret.
      APP_ADMIN_PASSWORD: typegen-only
      # No GeoLite2 database in CI; settings construction must not fail.
      GEOIP_VALIDATE_DB_PATH: "false"
      # Dev mode would register dev-only vite routes and pollute routes.json.
      VITE_DEV_MODE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate TypeScript contracts
        run: uv run litestar --app geometrikks.server.core:create_app assets generate-types
      - name: Fail on generated-contract drift
        run: |
          if [[ -n "$(git status --porcelain resources/generated)" ]]; then
            echo "resources/generated/ is stale; run 'litestar assets generate-types' and commit the result."
            git status --porcelain resources/generated
            git diff -- resources/generated | head -200
            exit 1
          fi
      - name: Frontend type check
        run: bun run typecheck

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      timescaledb:
        image: timescale/timescaledb-ha:pg18
        env:
          POSTGRES_USER: geouser
          POSTGRES_PASSWORD: geopass
          POSTGRES_DB: geometrikks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geouser -d geometrikks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SMOKE_IMAGE: geometrikks:ci
      SMOKE_BASE_URL: http://127.0.0.1:8000
      SMOKE_ADMIN_USER: admin
      # Deliberately disposable and non-secret: Playwright traces are uploaded.
      SMOKE_ADMIN_PASSWORD: ci-smoke-password
      SMOKE_ARTIFACT_NAME: container-smoke-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Run frontend tests
        run: bun run test
      - name: Test PR smoke summary helper
        run: node --test .github/scripts/pr-smoke-summary.test.cjs
      - uses: docker/setup-buildx-action@v3
      # The step names from here through "Upload smoke artifacts" are
      # referenced verbatim by .github/scripts/pr-smoke-summary.cjs; renaming
      # one silently shows it as "not run" in the sticky PR comment.
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          build-args: |
            APP_IMAGE_TAG=ci-${{ github.sha }}
          cache-from: type=gha,scope=container-smoke
          cache-to: type=gha,mode=max,scope=container-smoke
      # npx/npm here is deliberate in this otherwise-bun repo: the Playwright
      # test runner only supports the Node runtime, and bun re-executes
      # node-shebang bins under bun.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Prepare smoke-test fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="${RUNNER_TEMP}/geometrikks-smoke/geoip"
          mkdir -p "${fixture_dir}" smoke-artifacts
          cp tests/GeoLite2-City-Test.mmdb "${fixture_dir}/GeoLite2-City.mmdb"
          echo "SMOKE_GEOIP_DIR=${fixture_dir}" >> "${GITHUB_ENV}"
          # A parseable access log so ingestion actually tails a file; without
          # one the tailer's validation loop blocks shutdown (the documented
          # missing-log-file edge) and the graceful-stop check below would not
          # exercise the normal teardown path.
          nginx_dir="${RUNNER_TEMP}/geometrikks-smoke/nginx"
          mkdir -p "${nginx_dir}"
          cp tests/valid_ipv4_log.txt "${nginx_dir}/access.log"
          echo "SMOKE_NGINX_DIR=${nginx_dir}" >> "${GITHUB_ENV}"
      - name: Start production image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name geometrikks-smoke \
            --publish 127.0.0.1:8000:8000 \
            --add-host host.docker.internal:host-gateway \
            --health-interval 2s \
            --volume "${SMOKE_GEOIP_DIR}:/app/data/geoip" \
            --volume "${SMOKE_NGINX_DIR}:/var/log/nginx:ro" \
            --env DB_HOST=host.docker.internal \
            --env DB_PORT=5432 \
            --env DB_USER=geouser \
            --env DB_PASSWORD=geopass \
            --env DB_NAME=geometrikks \
            --env APP_ADMIN_USER="${SMOKE_ADMIN_USER}" \
            --env APP_ADMIN_PASSWORD="${SMOKE_ADMIN_PASSWORD}" \
            --env MAP_AUTO_DETECT_HOME=false \
            "${SMOKE_IMAGE}"
      - name: Run HTTP smoke checks
        shell: bash
        run: |
          set -euo pipefail

          ready=false
          for _ in {1..60}; do
            if curl --fail --silent --show-error \
              "${SMOKE_BASE_URL}/health/ready" \
              > smoke-artifacts/readiness.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != "true" ]]; then
            echo "Application did not become ready within 60 seconds."
            exit 1
          fi

          docker_health=""
          for _ in {1..20}; do
            docker_health="$(docker inspect --format '{{.State.Health.Status}}' geometrikks-smoke)"
            if [[ "${docker_health}" == "healthy" ]]; then
              break
            fi
            if [[ "${docker_health}" == "unhealthy" ]]; then
              echo "Docker health check reported unhealthy."
              exit 1
            fi
            sleep 1
          done
          if [[ "${docker_health}" != "healthy" ]]; then
            echo "Docker health check did not become healthy."
            exit 1
          fi

          curl --fail --silent --show-error "${SMOKE_BASE_URL}/health" \
            | tee smoke-artifacts/health.json \
            | python3 -c 'import json, sys; body = json.load(sys.stdin); assert body["status"] == "healthy", body; assert body["database"]["reachable"] is True, body; assert body["geoip"]["available"] is True, body; assert body["ingestion"]["running"] is True, body'

          curl --fail --silent --show-error "${SMOKE_BASE_URL}/" \
            > smoke-artifacts/index.html
          grep --quiet '<title>GeoMetrikks</title>' smoke-artifacts/index.html

          unauthenticated_status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "${SMOKE_BASE_URL}/api/v1/auth/me"
          )"
          if [[ "${unauthenticated_status}" != "401" ]]; then
            echo "Expected unauthenticated API status 401, got ${unauthenticated_status}."
            exit 1
          fi
      - name: Run browser smoke test
        run: npm run test:smoke
      - name: Run auth-disabled smoke checks
        shell: bash
        run: |
          set -euo pipefail

          # Regression guard for the auth-disabled 404 spam: the SPA calls
          # /api/v1/auth/me on every load, and with the routes unregistered
          # each call raised NotFoundException and logged an error-level
          # traceback. Same image, second container, no admin credentials.
          container=geometrikks-smoke-noauth
          noauth_url="http://127.0.0.1:8001"
          noauth_log=smoke-artifacts/noauth.log

          # The job's cleanup step only knows about geometrikks-smoke, so this
          # container owns its own teardown: keep the log either way, and never
          # leak the container when an assertion below fails.
          cleanup() {
            docker logs "${container}" > "${noauth_log}" 2>&1 || true
            docker rm --force "${container}" > /dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # This reuses DB_NAME=geometrikks and the same mounted nginx log as
          # the first, still-running container, so two ingestion pipelines
          # briefly write to the same database. Deliberate: reusing the exact
          # config the first container already proved it boots with is worth
          # more than avoiding the noise, and every assertion below is about
          # HTTP responses and the exception log, neither of which the
          # double-ingestion affects.
          docker run --detach \
            --name "${container}" \
            --publish 127.0.0.1:8001:8000 \
            --add-host host.docker.internal:host-gateway \
            --volume "${SMOKE_GEOIP_DIR}:/app/data/geoip" \
            --volume "${SMOKE_NGINX_DIR}:/var/log/nginx:ro" \
            --env DB_HOST=host.docker.internal \
            --env DB_PORT=5432 \
            --env DB_USER=geouser \
            --env DB_PASSWORD=geopass \
            --env DB_NAME=geometrikks \
            --env APP_AUTH_DISABLED=true \
            --env MAP_AUTO_DETECT_HOME=false \
            "${SMOKE_IMAGE}"

          ready=false
          for _ in {1..60}; do
            if curl --fail --silent --show-error "${noauth_url}/health/ready" > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != "true" ]]; then
            echo "Auth-disabled container did not become ready within 60 seconds."
            exit 1
          fi

          curl --fail --silent --show-error "${noauth_url}/api/v1/auth/me" \
            | tee smoke-artifacts/noauth-me.json \
            | python3 -c 'import json, sys; body = json.load(sys.stdin); assert body == {"mode": "disabled"}, body'

          # Provoke a path that matches no route. The record's fields are
          # already pinned by tests/test_logging_pipeline.py
          # (TestExceptionLoggingWiring), against a real app carrying the real
          # logging config. The only thing this container adds is the console
          # sink under Granian in the shipped image, which those tests cannot
          # reach, so that is the only thing asserted below.
          unknown_status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "${noauth_url}/api/v1/does-not-exist"
          )"
          if [[ "${unknown_status}" != "404" ]]; then
            echo "Expected 404 for an unknown API path, got ${unknown_status}."
            exit 1
          fi

          # Console output goes through the non-blocking queue listener, so it
          # is written asynchronously. This poll is a flush barrier, not an
          # assertion: without it the absence check below reads a log that has
          # not caught up yet and passes for the wrong reason. Both patterns
          # must match the SAME line so the barrier waits for our record and
          # not some earlier one. The renderer wraps event names and values in
          # colors rather than splitting them, so these two match despite the
          # ANSI escapes; "status_code=404" would not.
          logged=false
          for _ in {1..20}; do
            docker logs "${container}" > "${noauth_log}" 2>&1
            if grep "client_error" "${noauth_log}" \
              | grep --quiet "/api/v1/does-not-exist"; then
              logged=true
              break
            fi
            sleep 1
          done
          if [[ "${logged}" != "true" ]]; then
            echo "No client_error record for the 404 within 20 seconds. Log tail:"
            tail -30 "${noauth_log}"
            exit 1
          fi

          # The assertion this step exists for: in the shipped image's console
          # output, that 404 left a warning and not the error-level traceback
          # that filled logs before the auth routes were registered.
          if grep --quiet "Uncaught exception" "${noauth_log}"; then
            echo "Auth-disabled container logged an uncaught exception:"
            grep --context 3 "Uncaught exception" "${noauth_log}"
            exit 1
          fi
      - name: Verify graceful shutdown
        shell: bash
        run: |
          set -euo pipefail

          # docker stop delivers SIGTERM to PID 1; the Granian direct-mode
          # master must drain ingestion and stop the scheduler before
          # exiting 0. This pins the Phase 6 shutdown fix: subprocess mode
          # (no SIGTERM forwarding) would fail the exit-code check here.
          docker stop --timeout 20 geometrikks-smoke
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' geometrikks-smoke)"
          if [[ "${exit_code}" != "0" ]]; then
            echo "Container exited with ${exit_code} after docker stop; expected 0."
            docker logs --tail 50 geometrikks-smoke
            exit 1
          fi

          docker logs geometrikks-smoke > smoke-artifacts/shutdown.log 2>&1
          for marker in "Stopped log ingestion service" "Stopped APScheduler" "Granian shutdown completed"; do
            if ! grep --quiet "${marker}" smoke-artifacts/shutdown.log; then
              echo "Missing graceful-shutdown marker: ${marker}"
              tail -50 smoke-artifacts/shutdown.log
              exit 1
            fi
          done
      - name: Write smoke-test summary
        if: always()
        shell: bash
        env:
          SMOKE_JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Production image smoke test"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Overall result | ${SMOKE_JOB_STATUS} |"
            if [[ "${SMOKE_JOB_STATUS}" == "success" ]]; then
              echo "| Docker health | healthy |"
              echo "| Database readiness | ready |"
              echo "| GeoIP fixture and ingestion | healthy |"
              echo "| Authentication and dashboard | passed |"
              echo "| Browser console/network errors | none |"
            fi
            echo
            echo "Diagnostics and screenshots: artifact \`${SMOKE_ARTIFACT_NAME}\`."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Collect smoke-test diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p smoke-artifacts
          docker inspect --format '{{json .State}}' geometrikks-smoke \
            > smoke-artifacts/container-state.json 2>&1 || true
          docker logs geometrikks-smoke \
            > smoke-artifacts/container.log 2>&1 || true
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SMOKE_ARTIFACT_NAME }}
          path: smoke-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Stop production image
        if: always()
        run: docker rm --force geometrikks-smoke 2>/dev/null || true
