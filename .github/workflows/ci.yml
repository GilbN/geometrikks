name: CI

on:
  push:
    # develop too, so its image cache is there for PRs to start from.
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: backend unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Type check
        run: uv run ty check geometrikks tests
      - name: Run unit tests
        run: uv run pytest -v --ignore=tests/integration
      - name: Config docs freshness
        run: uv run python scripts/generate_config_docs.py --check

  backend-integration:
    name: backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      timescaledb:
        # TimescaleDB 2.31.0 rejects TRUNCATE on continuous aggregates, which
        # the clean_tables fixture in tests/integration/conftest.py needs.
        image: timescale/timescaledb-ha:pg18-ts2.30
        env:
          POSTGRES_USER: geouser
          POSTGRES_PASSWORD: geopass
          POSTGRES_DB: geometrikks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geouser -d geometrikks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run integration tests
        env:
          IT_DB_HOST: localhost
          IT_DB_PORT: "5432"
          IT_DB_USER: geouser
          IT_DB_PASSWORD: geopass
        run: uv run pytest -v tests/integration

  contracts:
    # The committed generated client (resources/generated/) must be exactly
    # what the backend produces, and the frontend must type-check against it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Typegen composes the real app; auth settings demand a password even
      # though no server ever starts. Deliberately non-secret.
      APP_ADMIN_PASSWORD: typegen-only
      # Dev mode would register dev-only vite routes and pollute routes.json.
      VITE_DEV_MODE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate TypeScript contracts
        run: uv run litestar --app geometrikks.server.core:create_app assets generate-types
      - name: Fail on generated-contract drift
        run: |
          if [[ -n "$(git status --porcelain resources/generated)" ]]; then
            echo "resources/generated/ is stale; run 'litestar assets generate-types' and commit the result."
            git status --porcelain resources/generated
            git diff -- resources/generated | head -200
            exit 1
          fi
      - name: Frontend type check
        run: bun run typecheck

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Run frontend tests
        run: bun run test
      - name: Test PR smoke summary helper
        run: node --test .github/scripts/pr-smoke-summary.test.cjs
      - name: Test smoke shard planner
        run: node --test .github/scripts/smoke-shards.test.cjs

  smoke:
    name: smoke ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Keep the other shards running so one failure doesn't hide the rest.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SMOKE_IMAGE: geometrikks:ci
      SMOKE_BASE_URL: http://127.0.0.1:8000
      SMOKE_ADMIN_USER: admin
      # Deliberately disposable and non-secret: Playwright traces are uploaded.
      SMOKE_ADMIN_PASSWORD: ci-smoke-password
      SMOKE_ARTIFACT_NAME: container-smoke-${{ matrix.shard }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      # The database pull, the browser install and the shard plan need nothing
      # from the image build, so they run under it instead of before it. "Wait
      # for the background setup" joins them.
      - name: Start TimescaleDB, the Playwright browser install and the shard plan
        shell: bash
        run: |
          set -euo pipefail
          background="${RUNNER_TEMP}/smoke-background"
          mkdir -p "${background}"
          echo "SMOKE_BACKGROUND=${background}" >> "${GITHUB_ENV}"
          image=timescale/timescaledb-ha:pg18
          # The exit files appear by rename, so the wait step never reads one
          # half written.
          (
            for attempt in 1 2 3; do
              docker pull --quiet "${image}" && break
              [[ ${attempt} -lt 3 ]] && sleep $((attempt * 5))
            done
            docker run --detach --name smoke-timescaledb \
              --publish 5432:5432 \
              --env POSTGRES_USER=geouser \
              --env POSTGRES_PASSWORD=geopass \
              --env POSTGRES_DB=geometrikks \
              --health-cmd "pg_isready -U geouser -d geometrikks" \
              --health-interval 2s --health-timeout 5s --health-retries 30 \
              "${image}" && status=0 || status=$?
            echo "${status}" > "${background}/timescaledb.exit.tmp"
            mv "${background}/timescaledb.exit.tmp" "${background}/timescaledb.exit"
          ) < /dev/null > "${background}/timescaledb.log" 2>&1 &
          # npx/npm here is deliberate in this otherwise-bun repo: the
          # Playwright test runner only supports the Node runtime, and bun
          # re-executes node-shebang bins under bun.
          (
            npx playwright install --with-deps --only-shell chromium && status=0 || status=$?
            echo "${status}" > "${background}/playwright.exit.tmp"
            mv "${background}/playwright.exit.tmp" "${background}/playwright.exit"
          ) < /dev/null > "${background}/playwright.log" 2>&1 &
          # Every shard checks all six lists the same way, so they all keep the
          # plan or all fall back to --shard. Any other error fails the shard,
          # since one shard falling back alone would break the split.
          total="${{ strategy.job-total }}"
          this_shard="${{ matrix.shard }}"
          list_tests() {
            npx playwright test --config=playwright.config.ts --project=smoke --list --reporter=json "$@"
          }
          plan_shards() {
            local dir="${background}/plan" shard verified pid pids=()
            mkdir -p "${dir}"
            list_tests > "${dir}/all.json" || return 1
            node .github/scripts/smoke-shards.cjs plan "${dir}/all.json" \
              tests/browser/smoke-durations.json "${total}" "${dir}" || return 1
            for shard in $(seq 1 "${total}"); do
              list_tests "$(cat "${dir}/${shard}.args")" > "${dir}/selected-${shard}.json" &
              pids+=("$!")
            done
            for pid in "${pids[@]}"; do
              wait "${pid}" || return 1
            done
            node .github/scripts/smoke-shards.cjs verify "${dir}/all.json" "${dir}"/selected-*.json \
              && verified=0 || verified=$?
            case "${verified}" in
              0) cp "${dir}/${this_shard}.args" "${background}/shard-args" ;;
              3) echo "--shard=${this_shard}/${total}" > "${background}/shard-args" ;;
              *) return 1 ;;
            esac
          }
          (
            plan_shards && status=0 || status=$?
            echo "${status}" > "${background}/plan.exit.tmp"
            mv "${background}/plan.exit.tmp" "${background}/plan.exit"
          ) < /dev/null > "${background}/plan.log" 2>&1 &
      - uses: docker/setup-buildx-action@v4
        with:
          # The runner is thrown away; removing the builder only adds a post step.
          cleanup: false
      # The step names from here through "Upload smoke artifacts" are
      # referenced verbatim by .github/scripts/pr-smoke-summary.cjs; renaming
      # one silently shows it as "not run" in the sticky PR comment.
      - name: Build production image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          build-args: |
            APP_IMAGE_TAG=ci-${{ github.sha }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=container-smoke
          # One writer per run: the shards build the same image.
          cache-to: ${{ matrix.shard == 1 && 'type=gha,mode=max,scope=container-smoke' || '' }}
      - name: Prepare smoke-test fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="${RUNNER_TEMP}/geometrikks-smoke/geoip"
          mkdir -p "${fixture_dir}" smoke-artifacts
          cp tests/GeoLite2-City-Test.mmdb "${fixture_dir}/GeoLite2-City.mmdb"
          echo "SMOKE_GEOIP_DIR=${fixture_dir}" >> "${GITHUB_ENV}"
          # A parseable access log so ingestion actually tails a file; without
          # one the tailer's validation loop blocks shutdown (the documented
          # missing-log-file edge) and the graceful-stop check below would not
          # exercise the normal teardown path.
          nginx_dir="${RUNNER_TEMP}/geometrikks-smoke/nginx"
          mkdir -p "${nginx_dir}"
          cp tests/valid_ipv4_log.txt "${nginx_dir}/access.log"
          echo "SMOKE_NGINX_DIR=${nginx_dir}" >> "${GITHUB_ENV}"
      - name: Wait for the background setup
        shell: bash
        run: |
          set -euo pipefail
          for task in timescaledb playwright plan; do
            for _ in {1..300}; do
              [[ -f "${SMOKE_BACKGROUND}/${task}.exit" ]] && break
              sleep 1
            done
            status="$(cat "${SMOKE_BACKGROUND}/${task}.exit" 2>/dev/null || echo "still running after 300s")"
            if [[ "${status}" != "0" ]]; then
              echo "The background ${task} step failed (${status}):"
              tail -50 "${SMOKE_BACKGROUND}/${task}.log"
              exit 1
            fi
          done
          args="$(cat "${SMOKE_BACKGROUND}/shard-args")"
          echo "SMOKE_SHARD_ARGS=${args}" >> "${GITHUB_ENV}"
          if [[ "${args}" == --shard=* ]]; then
            echo "::warning::The duration-balanced shard plan did not run every test once, so this run splits by test count."
            cat "${SMOKE_BACKGROUND}/plan.log"
          fi
          for _ in {1..60}; do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' smoke-timescaledb)" == "healthy" ]]; then
              exit 0
            fi
            sleep 1
          done
          echo "TimescaleDB did not become healthy within 60 seconds."
          docker logs --tail 50 smoke-timescaledb
          exit 1
      - name: Start production image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name geometrikks-smoke \
            --publish 127.0.0.1:8000:8000 \
            --add-host host.docker.internal:host-gateway \
            --health-interval 2s \
            --volume "${SMOKE_GEOIP_DIR}:/app/data/geoip" \
            --volume "${SMOKE_NGINX_DIR}:/var/log/access:ro" \
            --env DB_HOST=host.docker.internal \
            --env DB_PORT=5432 \
            --env DB_USER=geouser \
            --env DB_PASSWORD=geopass \
            --env DB_NAME=geometrikks \
            --env APP_ADMIN_USER="${SMOKE_ADMIN_USER}" \
            --env APP_ADMIN_PASSWORD="${SMOKE_ADMIN_PASSWORD}" \
            --env MAP_AUTO_DETECT_SERVER_LOCATION=false \
            "${SMOKE_IMAGE}"
      - name: Run HTTP smoke checks
        shell: bash
        run: |
          set -euo pipefail

          ready=false
          for _ in {1..60}; do
            if curl --fail --silent --show-error \
              "${SMOKE_BASE_URL}/health/ready" \
              > smoke-artifacts/readiness.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "${ready}" != "true" ]]; then
            echo "Application did not become ready within 60 seconds."
            exit 1
          fi

          docker_health=""
          for _ in {1..20}; do
            docker_health="$(docker inspect --format '{{.State.Health.Status}}' geometrikks-smoke)"
            if [[ "${docker_health}" == "healthy" ]]; then
              break
            fi
            if [[ "${docker_health}" == "unhealthy" ]]; then
              echo "Docker health check reported unhealthy."
              exit 1
            fi
            sleep 1
          done
          if [[ "${docker_health}" != "healthy" ]]; then
            echo "Docker health check did not become healthy."
            exit 1
          fi

          curl --fail --silent --show-error "${SMOKE_BASE_URL}/health" \
            | tee smoke-artifacts/health.json \
            | python3 -c 'import json, sys; body = json.load(sys.stdin); assert body["status"] == "healthy", body; assert body["database"]["reachable"] is True, body; assert body["geoip"]["available"] is True, body; assert body["ingestion"]["running"] is True, body'

          curl --fail --silent --show-error "${SMOKE_BASE_URL}/" \
            > smoke-artifacts/index.html
          grep --quiet '<title>GeoMetrikks</title>' smoke-artifacts/index.html
          # Check the deployed shell, after all image COPY steps and the SPA handler.
          grep --quiet -- '--startup-background' smoke-artifacts/index.html
          if grep --quiet '<!-- theme-head -->' smoke-artifacts/index.html; then
            echo "Production served the unbuilt HTML template."
            exit 1
          fi

          unauthenticated_status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "${SMOKE_BASE_URL}/api/v1/auth/me"
          )"
          if [[ "${unauthenticated_status}" != "401" ]]; then
            echo "Expected unauthenticated API status 401, got ${unauthenticated_status}."
            exit 1
          fi
      - name: Run browser smoke test
        run: npm run test:smoke -- ${SMOKE_SHARD_ARGS}
      - name: Verify graceful shutdown
        shell: bash
        run: |
          set -euo pipefail

          # docker stop delivers SIGTERM to PID 1; the Granian direct-mode
          # master must drain ingestion and stop the scheduler before
          # exiting 0. This pins the Phase 6 shutdown fix: subprocess mode
          # (no SIGTERM forwarding) would fail the exit-code check here.
          docker stop --timeout 20 geometrikks-smoke
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' geometrikks-smoke)"
          if [[ "${exit_code}" != "0" ]]; then
            echo "Container exited with ${exit_code} after docker stop; expected 0."
            docker logs --tail 50 geometrikks-smoke
            exit 1
          fi

          docker logs geometrikks-smoke > smoke-artifacts/shutdown.log 2>&1
          for marker in "ingestion_stopped" "scheduler_stopped" "Granian shutdown completed"; do
            if ! grep --quiet "${marker}" smoke-artifacts/shutdown.log; then
              echo "Missing graceful-shutdown marker: ${marker}"
              tail -50 smoke-artifacts/shutdown.log
              exit 1
            fi
          done
      - name: Write smoke-test summary
        if: always()
        shell: bash
        env:
          SMOKE_JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Production image smoke test, shard ${{ matrix.shard }}/${{ strategy.job-total }}"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Overall result | ${SMOKE_JOB_STATUS} |"
            if [[ "${SMOKE_JOB_STATUS}" == "success" ]]; then
              echo "| Docker health | healthy |"
              echo "| Database readiness | ready |"
              echo "| GeoIP fixture and ingestion | healthy |"
              echo "| Browser smoke tests in this shard | passed |"
            fi
            echo
            echo "Diagnostics and screenshots: artifact \`${SMOKE_ARTIFACT_NAME}\`."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Collect smoke-test diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p smoke-artifacts
          docker inspect --format '{{json .State}}' geometrikks-smoke \
            > smoke-artifacts/container-state.json 2>&1 || true
          docker logs geometrikks-smoke \
            > smoke-artifacts/container.log 2>&1 || true
          docker logs smoke-timescaledb \
            > smoke-artifacts/timescaledb.log 2>&1 || true
          cp "${SMOKE_BACKGROUND}"/*.log smoke-artifacts/ 2>/dev/null || true
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SMOKE_ARTIFACT_NAME }}
          path: smoke-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Stop production image
        if: always()
        run: docker rm --force geometrikks-smoke 2>/dev/null || true

  site:
    # geometrikks.dev is built from site/, CHANGELOG.md, SECURITY.md, the
    # OpenAPI schema and the screenshots. A version URL that moves, a missing
    # redirect, a dead docs link or an app docs URL with no page behind it
    # must fail here, not on Cloudflare.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
      - uses: oven-sh/setup-bun@v2
      - name: Install site dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun test
      - name: Build site
        run: bun run build
      - name: Record pending release folders
        id: plan
        run: echo "pending=$(jq -r '.pending | length' .generated/versions.json)" >> "$GITHUB_OUTPUT"
      # After the build: the types import what its prepare step generates.
      - name: Type check
        run: bun run typecheck
      - name: Smoke test the site
        run: bun run smoke tests/smoke/site.json
      - name: Build the fixture site
        env:
          DOCS_CONTENT_DIR: tests/fixtures/content
          DOCS_PUBLISHED: 0.1.0
        run: bun run build
      - name: Smoke test the fixture site
        run: bun run smoke tests/smoke/fixture.json
      - name: Rehearse the pending release folder's promotion
        if: steps.plan.outputs.pending != '0'
        run: |
          versions="$(ls content/docs | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | paste -sd,)"
          DOCS_PUBLISHED="${versions}" bun run build
