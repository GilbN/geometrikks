name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      # Full history is needed to resolve annotated tags and the branch heads.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure the tag is on its release branch
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/develop:refs/remotes/origin/develop

          if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
            expected_commit="$(git rev-parse origin/develop)"
            [[ "${tag_commit}" == "${expected_commit}" ]] || {
              echo "Develop releases must be tagged at the current develop HEAD."
              exit 1
            }
          elif [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            expected_commit="$(git rev-parse origin/main)"
            [[ "${tag_commit}" == "${expected_commit}" ]] || {
              echo "Stable releases must be tagged at the current main HEAD."
              exit 1
            }
          else
            echo "Invalid release tag: ${tag}"
            echo "Use vX.Y.Z-dev.N on develop or vX.Y.Z on main."
            exit 1
          fi

  publish-image:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          # A cache saved from a tag run is only visible to that same tag.
          cache-image: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/gilbn/geometrikks
          # latest only on stable (non-prerelease) semver tags
          # develop is a moving tag that always points at the newest dev release
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=develop,enable=${{ contains(github.ref_name, '-dev.') }}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_IMAGE_TAG=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
            GEOMETRIKKS_VERSION=${{ github.ref_name }}
          # Tag runs can read only main's caches, so a stable release reuses the
          # amd64 layers CI cached for the same commit. Nothing would ever read
          # a cache this run wrote, so there is no cache-to.
          cache-from: type=gha,scope=container-smoke

  docs-promote:
    name: Rebuild the docs for a stable release
    needs: publish-image
    if: ${{ !contains(github.ref_name, '-dev.') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger the develop docs build
        env:
          DOCS_DEPLOY_HOOK_URL: ${{ secrets.DOCS_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "${DOCS_DEPLOY_HOOK_URL}" ]]; then
            echo "::notice::DOCS_DEPLOY_HOOK_URL is not set; the release folder is promoted by the next develop build."
            exit 0
          fi
          curl -fsS --retry 3 -X POST "${DOCS_DEPLOY_HOOK_URL}" -o /dev/null
