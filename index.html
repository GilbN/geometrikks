<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/static/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon-180x180.png" />
    <!-- The web app manifest link is injected by main.tsx in production
         builds only; the dev HTML transform would mangle a hardcoded href. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f6f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#010810" />
    <meta name="color-scheme" content="dark light" />
    <title>GeoMetrikks</title>
    <script>
      // Prevent flash bang - apply theme immediately before render
      // Default theme is 'dark' (matches ThemeProvider defaultTheme in __root.tsx)
      (function() {
        const storageKey = 'geometrikks-theme';
        const theme = localStorage.getItem(storageKey);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        // Dark if: explicitly dark, OR no preference (default to dark), OR system preference is dark
        const isDark = theme === 'dark' || !theme || (theme === 'system' && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
        // Mirrors lib/accent.ts: teal is the default and needs no attribute.
        const accent = localStorage.getItem('geometrikks-accent');
        if (accent === 'green' || accent === 'copper') {
          document.documentElement.setAttribute('data-accent', accent);
        }
      })();
    </script>
    <style>
      /* CSS to prevent flash bang - theme surface colors from main.css */
      html.dark, html.dark body { background-color: oklch(0.13 0.025 245); color: oklch(0.95 0.01 220); }
      html:not(.dark), html:not(.dark) body { background-color: oklch(0.97 0.008 220); color: oklch(0.22 0.03 250); }
    </style>
    <link rel="stylesheet" href="/resources/main.css">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/resources/main.tsx"></script>
  </body>
</html>
