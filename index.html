<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/static/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon-180x180.png" />
    <!-- The web app manifest link is injected by main.tsx in production
         builds only; the dev HTML transform would mangle a hardcoded href. -->
    <meta name="color-scheme" content="dark light" />
    <title>GeoMetrikks</title>
    <meta name="description" content="Real-time GeoIP map and traffic analytics from your reverse-proxy access logs (nginx, Traefik), with CrowdSec ban management." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GeoMetrikks" />
    <meta property="og:description" content="Real-time GeoIP map and traffic analytics from your reverse-proxy access logs (nginx, Traefik), with CrowdSec ban management." />
    <!-- Relative on purpose: the app does not know its public origin. Most
         unfurlers (Slack, Discord, iMessage, Mastodon) resolve it; Facebook
         does not, and GitHub uses the repo's own social preview upload. -->
    <meta property="og:image" content="/static/brand/social-card-dark.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- theme-head -->
    <link rel="stylesheet" href="/resources/main.css">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/resources/main.tsx"></script>
  </body>
</html>
