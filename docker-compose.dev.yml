services:

  # ===========================================================================
  # TimescaleDB with PostGIS
  # ===========================================================================
  timescale_db:
    container_name: timescale_db
    image: timescale/timescaledb-ha:pg18
    restart: always
    shm_size: 256mb
    # Worker pool sized for the app's ~32 background jobs, whose CAGG
    # refresh policies all fire on the same tick; see docker-compose.yml.
    command:
      - -c
      - timescaledb.max_background_workers=40
      - -c
      - max_parallel_workers=8
      - -c
      - max_worker_processes=51
    environment:
      POSTGRES_USER: geouser
      POSTGRES_PASSWORD: geopass
      POSTGRES_DB: geometrikks
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/home/postgres/pgdata/data
    networks:
      - geometrikks_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U geouser -d geometrikks" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # GeoMetrikks Backend (Production)
  # ===========================================================================
  app:
    container_name: geometrikks_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    hostname: geometrikks
    environment:
      APP_ENVIRONMENT: production
      # Admin login for the web UI/API. Set both in .env; the app refuses to
      # start without a password unless APP_AUTH_DISABLED=true (reverse-proxy
      # mode behind Authelia/Tailscale etc.).
      APP_ADMIN_USER: ${APP_ADMIN_USER:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      DB_HOST: timescale_db
      DB_PORT: 5432
      DB_USER: geouser
      DB_PASSWORD: geopass
      DB_DATABASE: geometrikks
      LOGPARSER_LOG_PATHS: /var/log/access/access.log
    ports:
      - "8000:8000"
    volumes:
      - /var/log/nginx:/var/log/access:ro
    networks:
      - geometrikks_net
    env_file:
      - .env
    depends_on:
      timescale_db:
        condition: service_healthy
    profiles:
      - prod

  # ===========================================================================
  # GeoMetrikks Backend (Development)
  # ===========================================================================
  app-dev:
    container_name: geometrikks_app_dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    hostname: geometrikks
    environment:
      APP_ENVIRONMENT: development
      APP_DEBUG: "true"
      API_RELOAD: "true"
      LOG_LEVEL: DEBUG
      # Outside /app so the reload watcher never sees log writes; mounted
      # from ./logs below, matching the prod compose and native runs.
      LOG_DIR: /var/log/geometrikks
      DB_HOST: timescale_db
      DB_PORT: 5432
      DB_USER: geouser
      DB_PASSWORD: geopass
      DB_DATABASE: geometrikks
      GEOIP_DB_PATH: /app/data/geoip/GeoLite2-City.mmdb
      LOGPARSER_LOG_PATHS: /var/log/access/access.log
      VITE_DEV_MODE: "true"
      VITE_EXECUTOR: "bun"
    ports:
      # Single dev origin: the Vite sidecar runs on an ephemeral localhost
      # port inside the container; assets and the HMR websocket are proxied
      # through :8000 by litestar-vite, so no Vite port is published.
      - "8000:8000"
    volumes:
      # Mount source code for hot-reload
      - ./geometrikks:/app/geometrikks:cached
      - ./resources:/app/resources:cached
      - ./tests:/app/tests:cached
      - ./data:/app/data:cached
      # Sample nginx access logs for ingestion, same mount point as prod
      - ./nginx_logs:/var/log/access:ro
      # The app's own log files (geometrikks.log, login.log)
      - ./logs:/var/log/geometrikks
    networks:
      - geometrikks_net
    env_file:
      - .env
    depends_on:
      timescale_db:
        condition: service_healthy
    profiles:
      - dev

networks:
  geometrikks_net:
    driver: bridge

volumes:
  timescale_data:
